# Builds, signs, and publishes a Windows release (NSIS installer + updater
# artifacts + latest.json) whenever a v* tag is pushed. The updater in the app
# polls the latest release's latest.json — see tauri.conf.json plugins.updater.
#
# Required repository secrets:
#   TAURI_SIGNING_PRIVATE_KEY — contents of the local ~/.tauri/plane-tool.key
#   WINDOWS_CODESIGN_PFX — base64 of ~/.tauri/plane-tool-codesign.pfx
#   WINDOWS_CODESIGN_PASSWORD — its password (~/.tauri/plane-tool-codesign.pfx.password.txt)
#   OPENAI_API_KEY_DEFAULT — baked into the binary at build time (src-tauri/build.rs)
#     as the AI briefing key every install seeds its keyring with, so users never
#     type one in themselves. Optional: releases build fine without it, the app
#     just falls back to rule-based briefings until a user sets their own key.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags: the release-notes step diffs against the previous tag.
          fetch-depth: 0

      # latest.json's "notes" — shown inside the app's update dialog and used
      # as the GitHub release body — comes from the tag's section in
      # CHANGELOG.md. Falls back to listing commit subjects since the previous
      # tag when the section is missing or empty, so a forgotten changelog
      # never blocks a release.
      - name: Build release notes
        id: notes
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          $notes = (& ./scripts/get-release-notes.ps1 -Version $version | Out-String).Trim()
          if (-not $notes) {
            $prev = git describe --tags --abbrev=0 "$env:GITHUB_REF_NAME^" 2>$null
            $range = if ($prev) { "$prev..$env:GITHUB_REF_NAME" } else { $env:GITHUB_REF_NAME }
            $log = git log $range --no-merges --pretty=format:"- %s" |
              Where-Object { $_ -notmatch '^- chore: bump version' }
            $notes = ($log -join "`n")
          }
          "notes<<NOTES_EOF" >> $env:GITHUB_OUTPUT
          $notes >> $env:GITHUB_OUTPUT
          "NOTES_EOF" >> $env:GITHUB_OUTPUT

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile

      # tauri.conf.json signs the installer via bundle.windows.certificateThumbprint,
      # so the certificate must exist in the runner's store before tauri-action runs.
      - name: Import code signing certificate
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX: ${{ secrets.WINDOWS_CODESIGN_PFX }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $path = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX))
          $pwd = ConvertTo-SecureString $env:WINDOWS_CODESIGN_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $path -CertStoreLocation Cert:\CurrentUser\My -Password $pwd
          Remove-Item $path

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
          OPENAI_API_KEY_DEFAULT: ${{ secrets.OPENAI_API_KEY_DEFAULT }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Plane Quick Dock ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.notes }}
          releaseDraft: false
          prerelease: false
