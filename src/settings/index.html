<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>설정 — Plane Quick Dock</title>
    <link rel="stylesheet" href="../shared/app.css" />
  </head>
  <body>
    <div class="settings">
      <h2>Plane 연결</h2>
      <label>Base URL<input id="baseUrl" placeholder="https://plane.example.com" /></label>
      <label>Workspace slug<input id="workspace" placeholder="acme" /></label>
      <label>API 토큰
        <span id="tokenSaved" class="token-saved-row" hidden>
          <span class="check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span class="mask">••••••••••••</span>
          <span class="meta">저장됨</span>
          <button type="button" class="token-change-btn" id="tokenChange">변경</button>
        </span>
        <input id="token" type="password" placeholder="API 토큰 입력" />
        <a id="tokenLink" class="token-link" href="#">토큰 발급받기 →</a>
      </label>
      <h2>단축키</h2>
      <label>빠른 추가<input id="qaShortcut" placeholder="F1" /></label>
      <label>사이드바<input id="sbShortcut" placeholder="F2" /></label>
      <h2>디스플레이</h2>
      <label>표시할 디스플레이<select id="displaySelect"></select></label>
      <h2>화면</h2>
      <label>테마
        <select id="theme">
          <option value="auto">시스템 설정 따르기</option>
          <option value="light">라이트</option>
          <option value="dark">다크</option>
        </select>
      </label>
      <h2>사이드바 자동 열기</h2>
      <label class="check-row"><input id="idleOpenEnabled" type="checkbox" />유휴 시 사이드바 자동 열기</label>
      <label>유휴 기준 시간(분)<input id="idleOpenMinutes" type="number" min="1" /></label>
      <h2>AI 브리핑</h2>
      <label>OpenAI API 키
        <span id="oaSaved" class="token-saved-row" hidden>
          <span class="check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          <span class="mask">••••••••••••</span>
          <span class="meta">저장됨</span>
          <button type="button" class="token-change-btn" id="oaChange">변경</button>
        </span>
        <input id="openaiKey" type="password" placeholder="sk-..." />
      </label>
      <label>모델<input id="briefingModel" placeholder="gpt-4o-mini" /></label>
      <label class="check-row"><input id="morningEnabled" type="checkbox" />아침 브리핑 자동 표시</label>
      <label>아침 브리핑 시각<input id="morningTime" type="time" /></label>
      <p id="status" class="status"></p>
      <div class="row"><button id="save">저장</button></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
