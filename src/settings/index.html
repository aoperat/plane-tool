<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>설정 — Plane Quick Dock</title>
    <link rel="stylesheet" href="../shared/app.css" />
  </head>
  <body class="transparent-body">
    <div class="set-card">
      <div class="set-head" data-tauri-drag-region>
        <svg class="set-grip" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.7"/><circle cx="15" cy="6" r="1.7"/><circle cx="9" cy="12" r="1.7"/><circle cx="15" cy="12" r="1.7"/><circle cx="9" cy="18" r="1.7"/><circle cx="15" cy="18" r="1.7"/></svg>
        <span class="set-head-title">설정</span>
        <button type="button" id="setClose" class="set-close" aria-label="닫기 (Esc)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></svg>
        </button>
      </div>
      <div class="set-tabs" role="tablist">
        <button type="button" class="set-tab active" data-tab="general" role="tab" aria-selected="true">일반</button>
        <button type="button" class="set-tab" data-tab="shortcuts" role="tab">단축키</button>
        <button type="button" class="set-tab" data-tab="automation" role="tab">자동화</button>
        <button type="button" class="set-tab" data-tab="briefing" role="tab">AI 브리핑</button>
      </div>
      <div class="settings">
      <section class="set-panel" data-panel="general" role="tabpanel">
        <h2>Plane 연결</h2>
        <label>Base URL<input id="baseUrl" placeholder="https://plane.example.com" /></label>
        <label>Workspace slug<input id="workspace" placeholder="acme" /></label>
        <label>API 토큰
          <span id="tokenSaved" class="token-saved-row" hidden>
            <span class="check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span class="mask">••••••••••••</span>
            <span class="meta">저장됨</span>
            <button type="button" class="token-change-btn" id="tokenChange">변경</button>
          </span>
          <input id="token" type="password" placeholder="API 토큰 입력" />
          <a id="tokenLink" class="token-link" href="#">토큰 발급받기 →</a>
        </label>
        <h2>화면</h2>
        <label>테마
          <select id="theme">
            <option value="auto">시스템 설정 따르기</option>
            <option value="light">라이트</option>
            <option value="dark">다크</option>
          </select>
        </label>
        <label>빠른 추가 화면
          <select id="quickaddLayout">
            <option value="compact">컴팩트 — 칩을 눌러 값 바꾸기</option>
            <option value="expanded">한눈에 보기 — 모든 항목 펼쳐 보기</option>
          </select>
        </label>
        <h2>디스플레이</h2>
        <label>표시할 디스플레이<select id="displaySelect"></select></label>
        <h2>개인정보</h2>
        <label class="check-row"><input id="showDelegatedTab" type="checkbox" />할당한 작업 보기</label>
      </section>
      <section class="set-panel" data-panel="shortcuts" role="tabpanel" hidden>
        <h2>단축키</h2>
        <label>빠른 추가<input id="qaShortcut" readonly placeholder="클릭 후 원하는 키 조합 입력" /></label>
        <label>사이드바<input id="sbShortcut" readonly placeholder="클릭 후 원하는 키 조합 입력" /></label>
      </section>
      <section class="set-panel" data-panel="automation" role="tabpanel" hidden>
        <h2>작업 전광판 자동 표시</h2>
        <label class="check-row"><input id="idleOpenEnabled" type="checkbox" />유휴 시 작업 전광판 표시</label>
        <label>전광판 표시까지의 유휴 시간(분)<input id="idleOpenMinutes" type="number" min="1" /></label>
        <h2>할당 알림</h2>
        <label class="check-row"><input id="assignNotifyEnabled" type="checkbox" />다른 사람이 나에게 작업을 할당하면 알림</label>
        <label>미확인 재알림 주기(시간)<input id="assignRemindHours" type="number" min="1" /></label>
        <h2>마감 알림</h2>
        <label class="check-row"><input id="deadlineNotifyEnabled" type="checkbox" />마감이 임박·경과한 작업을 하루 한 번 알림</label>
        <label>마감 알림 시각<input id="deadlineNotifyTime" type="time" /></label>
        <label>임박 기준 일수<input id="deadlineLeadDays" type="number" min="1" /></label>
      </section>
      <section class="set-panel" data-panel="briefing" role="tabpanel" hidden>
        <h2>AI 브리핑</h2>
        <label>OpenAI API 키
          <span id="oaSaved" class="token-saved-row" hidden>
            <span class="check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
            <span class="mask">••••••••••••</span>
            <span class="meta">저장됨</span>
            <button type="button" class="token-change-btn" id="oaChange">변경</button>
          </span>
          <input id="openaiKey" type="password" placeholder="sk-..." />
        </label>
        <label>모델<input id="briefingModel" placeholder="gpt-4o-mini" /></label>
        <label class="check-row"><input id="morningEnabled" type="checkbox" />아침 브리핑 자동 표시</label>
        <label>아침 브리핑 시각<input id="morningTime" type="time" /></label>
      </section>
      <p id="status" class="status"></p>
      <div class="row"><button id="save">저장</button></div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
