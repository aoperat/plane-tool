<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>빠른 추가</title>
    <link rel="stylesheet" href="../shared/app.css" />
  </head>
  <body class="transparent-body">
    <!-- 카드(헤더·제목·설명·필드·에러)는 shared/issueForm/card.ts가 그린다.
         이 파일에는 이 창에만 있는 것 — 푸터와 안내 말풍선 — 만 둔다. -->
    <div id="cardHost"></div>

    <template id="qaFooter">
      <div class="popup-bottom">
        <button id="projBtn" class="proj-select" type="button">
          <span id="projDot" class="dot"></span>
          <span data-proj-name id="projName">프로젝트 선택</span>
          <span class="chev">▾</span>
        </button>
        <!-- AI 제안과 등록은 "누르면 무언가 일어나는" 한 무리다. 푸터가 양끝
             정렬이라 셋을 나란히 두면 AI 제안만 한가운데 떠서 어디에도 속하지
             않는다 — 오른쪽으로 묶는다.
             지우기는 하위가 붙어 있을 때만 나타난다 — 제목을 고치지 않고도
             적용한 하위를 걷어낼 수 있어야 한다 (main.ts renderPendingBadge). -->
        <div class="qa-actions">
          <span class="qa-ai-group">
            <button type="button" id="qaAiBtn" class="qa-ai">✨ AI 제안</button>
            <button type="button" id="qaAiMode" class="qa-ai-mode" aria-label="AI 제안 유형 선택">▾</button>
            <button type="button" id="qaAiClear" class="qa-ai-clear" hidden aria-label="적용한 하위 작업 지우기">×</button>
            <!-- 무엇을 고칠지 고르는 메뉴. 버튼 클릭마다 묻지 않도록 마지막
                 선택을 기억한다(main.ts의 aiModes). 둘 다 끄는 것은 막는다 —
                 보낼 부탁이 없다. -->
            <div id="qaAiMenu" class="qa-ai-menu" hidden>
              <label><input type="checkbox" id="qaAiRefine" /> 제목 다듬기 <span class="hint">맞춤법·말투</span></label>
              <label class="sub"><input type="checkbox" id="qaAiStrip" /> 프로젝트명 겹침 제거</label>
              <label><input type="checkbox" id="qaAiSplit" /> 하위 작업 분해</label>
            </div>
          </span>
          <button type="button" id="qaSubmit" class="qa-submit">추가 <span class="bk">Ctrl+↵</span></button>
        </div>
      </div>
    </template>

    <!-- 업데이트 후 첫 안내. 제목 입력을 막지 않도록 카드 위에 겹쳐 뜨기만 하고
         포커스는 가져가지 않는다 (main.ts의 코치마크 로직 참고). -->
    <template id="qaCoach">
      <div class="qa-coach" hidden>
        <div class="qa-coach-head">✨ 새로워졌어요</div>
        <p>담당자·상태·우선순위·날짜를 <b>접지 않고 한 화면에</b> 펼쳐 보는 모양이 생겼습니다. 여기서 바로 바꿀 수 있어요.</p>
        <div class="qa-coach-foot">
          <button type="button" id="qaCoachOk" class="qa-coach-ok">알겠어요</button>
        </div>
      </div>
    </template>

    <div id="qaTip" class="qa-tip" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
