<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>빠른 추가</title>
    <link rel="stylesheet" href="../shared/app.css" />
  </head>
  <body class="transparent-body">
    <div class="popup" style="position:static;width:100%;transform:none;">
      <div class="popup-top">
        <div class="accent-bar"></div>
        <input id="title" class="title-input" placeholder="진행 중인 작업을 입력하고 Enter…" autofocus />
      </div>
      <textarea id="description" class="description-input" placeholder="설명을 입력하세요…" rows="1"></textarea>
      <div class="chip-row" id="chipRow">
        <button type="button" class="chip" id="chipAssignee"></button>
        <button type="button" class="chip" id="chipStart"></button>
        <button type="button" class="chip" id="chipDue"></button>
        <button type="button" class="chip" id="chipState"></button>
        <button type="button" class="chip" id="chipPriority"></button>
        <div id="fieldPopover" class="field-popover" hidden></div>
      </div>
      <div class="popup-bottom">
        <button id="projBtn" class="proj-select" type="button">
          <span id="projDot" class="dot"></span>
          <span id="projName">프로젝트 선택</span>
          <span class="chev">▾</span>
        </button>
        <div class="keys"><kbd>Enter</kbd> 추가 · <kbd>Esc</kbd> 닫기</div>
      </div>
      <div id="dropdown" class="dropdown" hidden></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
