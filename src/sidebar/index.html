<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>Quick Dock</title>
    <link rel="stylesheet" href="../shared/app.css" />
  </head>
  <body>
    <aside class="sidebar" style="position:static;width:100%;height:100vh;">
      <div class="sb-head">
        <div id="openPlane" class="logo" title="Plane 웹 열기"><svg viewBox="0 0 460 460" fill="#fff" fill-rule="evenodd"><path d="M73 136 L71 240 L87 266 L212 328 L226 320 L227 295 L293 328 L306 323 L308 295 L374 328 L387 323 L388 215 L375 195 L246 131 L234 138 L232 164 L165 131 L153 138 L152 164 L84 131 Z M234 164 L294 194 L305 206 L308 216 L307 295 L246 265 L236 254 L233 247 Z M153 164 L211 193 L222 203 L227 215 L226 295 L165 265 L155 254 L152 247 Z"/></svg></div>
        <div class="t">Quick Dock</div>
        <span id="user" class="u"></span>
        <span id="briefingBtn" class="hbtn" title="AI 브리핑"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M8 1.5l1.4 3.6 3.6 1.4-3.6 1.4L8 11.5 6.6 7.9 3 6.5l3.6-1.4z"/><path d="M12.8 10.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z"/></svg></span>
        <span id="searchToggle" class="hbtn" title="검색 (Ctrl+F)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M13.2 13.2 10.3 10.3"/></svg></span>
        <span id="conflictBadge" class="hbtn" title="동기화 충돌" hidden><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 1.5 14.5 13h-13z" stroke-linejoin="round"/><path d="M8 6v3.5" stroke-linecap="round"/><circle cx="8" cy="11.3" r=".6" fill="currentColor" stroke="none"/></svg><span id="conflictCount" class="count"></span></span>
        <span id="moreMenu" class="hbtn" title="더보기"><svg viewBox="0 0 16 16" fill="currentColor"><circle cx="3.2" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="12.8" cy="8" r="1.3"/></svg></span>
      </div>
      <div class="sb-search-bar" id="searchBar" hidden>
        <div class="sb-search-row">
          <span class="sicon"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><circle cx="7" cy="7" r="4.6"/><path d="M13.2 13.2 10.3 10.3"/></svg></span>
          <input id="searchInput" class="sb-search-input" placeholder="제목 또는 프로젝트명으로 검색" autocomplete="off" />
          <span id="searchCount" class="sb-search-count"></span>
          <span id="searchClear" class="sb-search-clear" title="닫기 (Esc)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></span>
        </div>
        <div class="sb-filter-row">
          <button type="button" id="statusFilterChip" class="sb-filter-chip">상태: 전체</button>
          <button type="button" id="priorityFilterChip" class="sb-filter-chip">우선순위: 전체</button>
        </div>
      </div>
      <div class="scroll">
        <div class="sb-section">
          <div id="inbox" class="inbox-sec" hidden></div>
          <div class="h">
            <span>나에게 할당된 작업</span>
            <span class="h-tools">
              <span id="hideDone" class="h-toggle"></span>
              <span id="taskCount" class="count">0</span>
            </span>
          </div>
          <div id="tasks"></div>
          <div id="emptyState" class="sb-empty" hidden>
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><circle cx="7" cy="7" r="4.6"/><path d="M13.2 13.2 10.3 10.3" stroke-linecap="round"/></svg>
            <span id="emptyText">일치하는 작업이 없습니다</span>
          </div>
        </div>
      </div>
      <div class="sb-foot">
        <span id="synced">동기화 대기</span>
        <span id="refresh" class="hbtn" title="새로고침"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 1.5v3h-3" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
    </aside>
    <div id="notesPanel" class="notes-panel" hidden>
      <div class="notes-head">
        <div class="t">릴리즈 노트</div>
        <span id="notesClose" class="hbtn" title="닫기 (Esc)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></span>
      </div>
      <div id="notesBody" class="notes-body"></div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
